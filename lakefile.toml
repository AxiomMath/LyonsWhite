name = "lyons"
defaultTargets = ["Lyons"]

[leanOptions]
pp.unicode.fun = true
autoImplicit = false
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.33.0"

[[lean_lib]]
name = "Lyons"

# The comparator pair. Deliberately NOT in defaultTargets: `Challenge` carries a
# permanent `sorry` (its statements are the artifact), and `lake lint` derives its
# scope from the default targets. The comparator builds both modules itself.
[[lean_lib]]
name = "Challenge"

[[lean_lib]]
name = "Solution"
